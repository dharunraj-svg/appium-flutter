name: Kiosk Android E2E

# This workflow does NOT build the kiosk app from source — the kiosk repo
# lives on Bitbucket (bitbucket.org/itrust_ventures/staff-turbo-flutter), not
# GitHub, so a GitHub PR trigger isn't available there. Instead this workflow
# downloads an already-built debug APK from a URL you provide and runs the
# Appium suite against it on a GitHub-hosted Android emulator. Wherever the
# APK gets built (locally, Codemagic, a Bitbucket Pipeline, etc.) can trigger
# this workflow with `gh workflow run` / the Actions "Run workflow" button,
# or via `repository_dispatch` if you want it automatic later.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to the debug APK. Required for kennel and groomers. The kiosk falls back to the KIOSK_APK_URL secret when left blank."
        required: false
        type: string
      app:
        description: "App to test. Every app runs the shared sign-in test; only the kiosk also runs the clock-in tests."
        required: true
        type: choice
        options:
          - RunLoyal Frontend Desk KIOSK
          - StaffApp Plus for Kennel
          - StaffApp Plus for Groomers
        default: RunLoyal Frontend Desk KIOSK
      device_type:
        description: "Emulator form factor. mobile is a Pixel 6 phone; tablet is a Pixel Tablet."
        required: true
        type: choice
        options:
          - mobile
          - tablet
        default: mobile
      target_environment:
        description: "GitHub environment whose secrets this run uses. PROD runs write real clock-in rows."
        required: true
        type: choice
        options:
          - UAT2
          - PROD
        default: UAT2

concurrency:
  group: kiosk-android-e2e-${{ inputs.target_environment }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Resolve the app under test
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          case "$APP" in
            "RunLoyal Frontend Desk KIOSK") echo "target_app=kiosk-android" >> "$GITHUB_OUTPUT" ;;
            "StaffApp Plus for Kennel") echo "target_app=kennel-android" >> "$GITHUB_OUTPUT" ;;
            "StaffApp Plus for Groomers") echo "target_app=groomers-android" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown app: $APP"; exit 1 ;;
          esac

      - name: Check out the appium-flutter test suite
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK (required by the Android SDK tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: npm ci

      - name: Install Appium and its drivers
        # Pinned to the version this suite was built and verified against —
        # appium-flutter-driver resolves its own compatible version against
        # whatever Appium is installed, so an unpinned `npm install -g appium`
        # could silently pick up a newer major version this suite has never
        # been run against.
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2
          appium driver install --source=npm appium-flutter-driver

      - name: Download the debug APK
        env:
          APP: ${{ inputs.app }}
          APK_URL_INPUT: ${{ inputs.apk_url }}
          KIOSK_APK_URL_SECRET: ${{ secrets.KIOSK_APK_URL }}
        run: |
          APK_URL="$APK_URL_INPUT"
          if [ -z "$APK_URL" ] && [ "$APP" = "RunLoyal Frontend Desk KIOSK" ]; then
            APK_URL="$KIOSK_APK_URL_SECRET"
          fi
          if [ -z "$APK_URL" ]; then
            echo "::error::No APK URL given. Pass apk_url when running this workflow. Only the kiosk falls back to the KIOSK_APK_URL repository secret."
            exit 1
          fi
          curl -fsSL "$APK_URL" -o "$RUNNER_TEMP/app-under-test.apk"
          if ! unzip -l "$RUNNER_TEMP/app-under-test.apk" | grep -q 'AndroidManifest.xml'; then
            echo "::error::The URL did not return an APK. Use a direct download link to the .apk file, not a web page."
            exit 1
          fi
          echo "APK_PATH=$RUNNER_TEMP/app-under-test.apk" >> "$GITHUB_ENV"

      - name: Start Appium server
        run: |
          appium --log-level error > appium.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Appium server did not become ready in time."
          cat appium.log
          exit 1

      # Without read/write access to /dev/kvm the emulator falls back to software
      # emulation, which took 10+ minutes to boot in CI.
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pick the emulator device
        id: device
        env:
          DEVICE_TYPE: ${{ inputs.device_type }}
        run: |
          case "$DEVICE_TYPE" in
            mobile) echo "profile=pixel_6" >> "$GITHUB_OUTPUT" ;;
            tablet) echo "profile=pixel_tablet" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown device_type: $DEVICE_TYPE"; exit 1 ;;
          esac

      # reactivecircus/android-emulator-runner boots a real Android Virtual
      # Device on the runner, runs the given script while it's up, then shuts
      # it down — so the emulator's whole lifecycle for this run is this step.
      - name: Run the Android E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: ${{ steps.device.outputs.profile }}
          disable-animations: true
          script: |
            if [ "$TARGET_APP" = "kiosk-android" ]; then npm run test:android; else npm run test:android:login; fi
        env:
          TARGET_APP: ${{ steps.app.outputs.target_app }}
          # Each app entry in config/apps.js reads its own APK path variable;
          # only the one for the selected app is used.
          KIOSK_APK_PATH: ${{ env.APK_PATH }}
          KENNEL_APK_PATH: ${{ env.APK_PATH }}
          GROOMERS_APK_PATH: ${{ env.APK_PATH }}
          ANDROID_UDID: emulator-5554
          KIOSK_TEST_EMAIL: ${{ secrets.KIOSK_TEST_EMAIL }}
          KIOSK_TEST_PASSWORD: ${{ secrets.KIOSK_TEST_PASSWORD }}
          KIOSK_EMPLOYEE_EMAIL: ${{ secrets.KIOSK_EMPLOYEE_EMAIL }}
          KIOSK_EMPLOYEE_PASSWORD_OR_PIN: ${{ secrets.KIOSK_EMPLOYEE_PASSWORD_OR_PIN }}
          KIOSK_SIM_LATITUDE: ${{ secrets.KIOSK_SIM_LATITUDE }}
          KIOSK_SIM_LONGITUDE: ${{ secrets.KIOSK_SIM_LONGITUDE }}

      - name: Upload the HTML report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-android-report
          path: |
            logs/report/latest.html
            logs/*-failure.png
          if-no-files-found: ignore
          retention-days: 14
